[package]
name = "guessing_game"
version = "0.1.0"
edition = "2021"

# Shared library used by both Android (cdylib) and the Windows binary (rlib)
[lib]
name = "guessing_game"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

# Desktop executable entry point (Windows/Linux/macOS)
[[bin]]
name = "guessing_game"
path = "src/main.rs"

[dependencies]
rand = "0.9"
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts"] }

# Only included when compiling for Android
[target.'cfg(target_os = "android")'.dependencies]
winit = "0.30"
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts", "android-native-activity"] }
