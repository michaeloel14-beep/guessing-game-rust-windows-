name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Android Targets
        run: rustup target add aarch64-linux-android

      - name: Install cargo-apk
        run: cargo install cargo-apk

      - name: Install Android Platform 30 & Build APK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-30" "build-tools;30.0.3"
          export ANDROID_HOME=$ANDROID_HOME
          export NDK_HOME=$ANDROID_NDK_LATEST_HOME
          cargo apk build --lib

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: guessing-game-android
          path: target/debug/apk/*.apk
